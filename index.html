<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contatore Vocale</title>
  <style>
    body { 
      font-family: system-ui, -apple-system, sans-serif; 
      text-align: center; 
      color: white; 
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 10px;
      box-sizing: border-box;
      background-color: #0d0d0d;
      position: relative;
      overflow: hidden;
    }

    .container-colonne {
      display: flex;
      flex-direction: row;
      justify-content: center;
      gap: 20px;
      width: 100%;
      max-width: 420px;
      margin-bottom: 40px;
      position: relative;
    }

    /* Animazione Arcobaleno per i bordi */
    @keyframes rainbowGlow {
      0% { border-color: #ff0000; box-shadow: 0 0 15px #ff0000; }
      20% { border-color: #ff8800; box-shadow: 0 0 15px #ff8800; }
      40% { border-color: #ffff00; box-shadow: 0 0 15px #ffff00; }
      60% { border-color: #00ff00; box-shadow: 0 0 15px #00ff00; }
      80% { border-color: #0088ff; box-shadow: 0 0 15px #0088ff; }
      100% { border-color: #ff00ff; box-shadow: 0 0 15px #ff00ff; }
    }

    /* Box parole rotondi */
    .contatore-card {
      background: rgba(255, 255, 255, 0.05);
      width: 135px;
      height: 135px;
      border-radius: 50%;
      border: 3px solid #ff0000;
      animation: rainbowGlow 6s infinite linear;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 10px;
      box-sizing: border-box;
      position: relative;
      cursor: pointer;
    }

    .etichetta { font-size: 13px; color: #aaa; font-weight: bold; letter-spacing: 1px; }
    .valore { font-size: 38px; font-weight: bold; color: #00ff88; margin-top: 2px; }

    /* Contenitore per dare l'ombra al pulsante con forma curva */
    .btn-container {
      width: 85%;
      max-width: 320px;
      filter: drop-shadow(0px 8px 12px rgba(0,0,0,0.7));
    }

    /* Pulsante di ascolto con bordi centrali e perimetrali curvati a sorriso */
    button { 
      width: 100%;
      padding: 18px 20px; 
      font-size: 17px; 
      border: none; 
      background: #007bff; 
      color: white; 
      cursor: pointer; 
      font-weight: bold;
      transition: background 0.3s;
      /* Curvatura totale concava al centro (sorriso) */
      clip-path: ellipse(100% 75% at 50% 25%);
      border-radius: 0 0 40px 40px;
    }

    /* Stile per le emoji volanti */
    .emoji-volante {
      position: absolute;
      font-size: 32px;
      pointer-events: none;
      animation: volaVersoAlto 1.2s ease-out forwards;
      z-index: 10;
    }

    @keyframes volaVersoAlto {
      0% {
        transform: translateY(0) scale(0.8);
        opacity: 1;
      }
      100% {
        transform: translateY(-130px) scale(1.4);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <div class="container-colonne">
    <!-- Colonna 1: Danieli (Birra 🍺) -->
    <div class="contatore-card" id="card1" onclick="incrementa('danieli')">
      <div class="etichetta">DANIELI</div>
      <div id="count1" class="valore">0</div>
    </div>

    <!-- Colonna 2: Pettorina (Missile 🚀) -->
    <div class="contatore-card" id="card2" onclick="incrementa('pettorina')">
      <div class="etichetta">PETTORINA</div>
      <div id="count2" class="valore">0</div>
    </div>
  </div>

  <div class="btn-container">
    <button id="btnStart" onclick="gestisciAscolto()">Avvia Ascolto</button>
  </div>

  <script>
    let contatori = {
      danieli: 0,
      pettorina: 0
    };
    
    let ascoltoAttivo = false;

    // Funzione per sparare l'emoji corretta dal box corrispondente
    function lanciaEmoji(cardId, emojiIcona) {
      const card = document.getElementById(cardId);
      const emoji = document.createElement('div');
      emoji.classList.add('emoji-volante');
      emoji.innerText = emojiIcona;
      
      emoji.style.left = '50px';
      emoji.style.top = '15px';
      
      card.appendChild(emoji);

      setTimeout(() => {
        emoji.remove();
      }, 1200);
    }

    function incrementa(tipo) {
      if (tipo === 'danieli') {
        contatori.danieli++;
        document.getElementById('count1').innerText = contatori.danieli;
        lanciaEmoji('card1', '🍺');
      } else if (tipo === 'pettorina') {
        contatori.pettorina++;
        document.getElementById('count2').innerText = contatori.pettorina;
        lanciaEmoji('card2', '🚀');
      }
    }

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
      alert("Il tuo browser non supporta il riconoscimento vocale. Usa Chrome o Safari.");
    } else {
      const recognition = new SpeechRecognition();
      recognition.lang = 'it-IT';
      recognition.continuous = true;
      recognition.interimResults = false;

      recognition.onresult = (event) => {
        const lastIndex = event.results.length - 1;
        let testo = event.results[lastIndex][0].transcript.toLowerCase();

        // Danieli -> Birra 🍺
        const occDanieli = (testo.match(/daniel[ie]/g) || []).length;
        if (occDanieli > 0) {
          for(let i=0; i<occDanieli; i++) incrementa('danieli');
        }

        // Pettorina -> Missile 🚀
        const occPettorina = (testo.match(/\bpettorina\b/g) || []).length;
        if (occPettorina > 0) {
          for(let i=0; i<occPettorina; i++) incrementa('pettorina');
        }
      };

      recognition.onend = () => {
        if (ascoltoAttivo) recognition.start();
      };

      function gestisciAscolto() {
        const btn = document.getElementById('btnStart');
        if (!ascoltoAttivo) {
          ascoltoAttivo = true;
          recognition.start();
          btn.innerText = "Interrompi Ascolto";
          btn.style.background = "#dc3545";
        } else {
          ascoltoAttivo = false;
          recognition.stop();
          btn.innerText = "Avvia Ascolto";
          btn.style.background = "#007bff";
        }
      }
    }
  </script>
</body>
</html>
