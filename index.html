<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contatore Vocale Doppi</title>
  <style>
    body { 
      font-family: sans-serif; 
      text-align: center; 
      color: white; 
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 10px;
      box-sizing: border-box;
      background: url('sfondo.jpg') no-repeat center center fixed;
      background-size: cover;
      position: relative;
    }
    
    body::before {
      content: "";
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.7);
      z-index: -1;
    }

    h1 { font-size: 20px; margin-bottom: 20px; color: #ddd; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); }

    .container-colonne {
      display: flex;
      flex-direction: row;
      justify-content: center;
      gap: 15px;
      width: 100%;
      max-width: 400px;
      margin-bottom: 25px;
    }

    /* Animazione Arcobaleno per i bordi */
    @keyframes rainbowGlow {
      0% { border-color: #ff0000; box-shadow: 0 0 15px #ff0000; }
      20% { border-color: #ff8800; box-shadow: 0 0 15px #ff8800; }
      40% { border-color: #ffff00; box-shadow: 0 0 15px #ffff00; }
      60% { border-color: #00ff00; box-shadow: 0 0 15px #00ff00; }
      80% { border-color: #0088ff; box-shadow: 0 0 15px #0088ff; }
      100% { border-color: #ff00ff; box-shadow: 0 0 15px #ff00ff; }
    }

    .contatore-card {
      background: rgba(0, 0, 0, 0.6);
      border-radius: 12px;
      padding: 15px 10px;
      flex: 1;
      border: 3px solid #ff0000;
      animation: rainbowGlow 6s infinite linear;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .etichetta { font-size: 16px; color: #fff; font-weight: bold; text-shadow: 1px 1px 3px rgba(0,0,0,0.8); }
    .valore { font-size: 50px; font-weight: bold; color: #00ff88; text-shadow: 2px 2px 6px rgba(0,0,0,0.8); margin-top: 10px; }

    button { padding: 12px 30px; font-size: 16px; border: none; border-radius: 8px; background: #007bff; color: white; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
  </style>
</head>
<body>

  <h1>Contatore Parole</h1>

  <div class="container-colonne">
    <!-- Colonna 1: Danieli -->
    <div class="contatore-card">
      <div class="etichetta">DANIELI</div>
      <div id="count1" class="valore">0</div>
    </div>

    <!-- Colonna 2: Pettorina -->
    <div class="contatore-card">
      <div class="etichetta">PETTORINA</div>
      <div id="count2" class="valore">0</div>
    </div>
  </div>

  <button id="btnStart" onclick="gestisciAscolto()">Avvia Ascolto</button>

  <script>
    let contatori = {
      danieli: 0,
      pettorina: 0
    };
    
    let ascoltoAttivo = false;

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
      alert("Il tuo browser non supporta il riconoscimento vocale. Usa Chrome o Safari.");
    } else {
      const recognition = new SpeechRecognition();
      recognition.lang = 'it-IT';
      recognition.continuous = true;
      recognition.interimResults = false;

      recognition.onresult = (event) => {
        const lastIndex = event.results.length - 1;
        let testo = event.results[lastIndex][0].transcript.toLowerCase();

        // Conta Danieli o Daniele
        const occDanieli = (testo.match(/daniel[ie]/g) || []).length;
        if (occDanieli > 0) {
          contatori.danieli += occDanieli;
          document.getElementById('count1').innerText = contatori.danieli;
        }

        // Conta Pettorina
        const occPettorina = (testo.match(/\bpettorina\b/g) || []).length;
        if (occPettorina > 0) {
          contatori.pettorina += occPettorina;
          document.getElementById('count2').innerText = contatori.pettorina;
        }
      };

      recognition.onend = () => {
        if (ascoltoAttivo) recognition.start();
      };

      function gestisciAscolto() {
        const btn = document.getElementById('btnStart');
        if (!ascoltoAttivo) {
          ascoltoAttivo = true;
          recognition.start();
          btn.innerText = "Interrompi Ascolto";
          btn.style.background = "#dc3545";
        } else {
          ascoltoAttivo = false;
          recognition.stop();
          btn.innerText = "Avvia Ascolto";
          btn.style.background = "#007bff";
        }
      }
    }
  </script>
</body>
</html>
